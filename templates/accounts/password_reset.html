{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <h2>🗺️ Recover Your Log Pose</h2>
  <p style="color:var(--text-dim);font-size:.9rem;">Enter your email and we'll send a password reset link (printed to server console in this local dev build).</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="field">
      <label for="id_email">Email</label>
      {{ form.email }}
    </div>
    <button type="submit" class="btn" style="width:100%;">Send Reset Link</button>
  </form>
  <div class="auth-links"><a href="{% url 'accounts:login' %}">Back to login</a></div>
</div></div>
{% endblock %}
